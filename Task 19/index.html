<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Shopping Cart</title>
  <script src="script.js" defer></script>
</head>
<body>
    <div id="navbar">
        <div class="Logo"><h1>Logo</h1></div>
        <div class="menu">
            <ul class="sub-menu">
                <li>Home</li>
                <li>Service</li>
                <li>Contact Us</li>
                <li>About us</li>
            </ul>
        </div>
        <div class="username">Username</div>
    </div>
    <hr>
    <div id="main">
<div class="left">

  <h2>Add Items</h2>
  
  <div id="cart">

  </div>

  <h3 id="total">Total: ₹0</h3>
<div >

  <form style="max-width: 500px; font-family: sans-serif; color: #333; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
  <h2 style="font-size: 1.2rem; margin: 0 0 15px 0;">Book Now</h2>
  
  <p style="margin: 0 0 15px 0;">
    <label style="display: block; font-size: 14px; margin-bottom: 5px;">Full Name</label>
    <input type="text" placeholder="John Doe" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
  </p>
  
  <div style="display: flex; gap: 15px; margin-bottom: 15px;">
    <p style="flex: 1; margin: 0;">
      <label style="display: block; font-size: 14px; margin-bottom: 5px;">Email ID</label>
      <input type="email" placeholder="example@gmail.com" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
    </p>
    <p style="flex: 1; margin: 0;">
      <label style="display: block; font-size: 14px; margin-bottom: 5px;">Phone Number</label>
      <input type="tel" placeholder="0000000000" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
    </p>
  </div>
  
  <button type="button" id="bookNow" class="book-now" onclick="error()"  style="width: 100%; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Book Now</button>
</form>
  
</div>
<p id="bookError" class="error"></p>
</div>
<div class="right">

 <div>
  <h2>Browes Our Services </h2>
  <p>click on the add to cart button to add<br/> service to your cart or press</p>
 </div>
 <hr>
<div class="products">

  <h2>Services</h2>
  <div id="products"></div>
</div>
</div>

</div>

</body>
</html>

  </body>
</html>
